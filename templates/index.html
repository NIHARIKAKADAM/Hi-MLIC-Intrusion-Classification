<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hi-MLIC Live Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>

/* Dashboard chart sizing */
.chart-container {
    position: relative;
    width: 100%;
    height: 300px;
}

.chart-container canvas {
    width: 100% !important;
    height: 100% !important;
}

        .card { border: none; border-radius: 12px; transition: 0.3s; }
        .stat-card:hover { transform: translateY(-5px); }
        .bg-gradient-danger { background: linear-gradient(45deg, #f5365c, #f56036); color: white; }
        .bg-gradient-success { background: linear-gradient(45deg, #2dce89, #2dcecc); color: white; }
        .bg-gradient-info { background: linear-gradient(45deg, #11cdef, #1171ef); color: white; }
        .progress { border-radius: 10px; background-color: #e9ecef; }
        body { transition: background-color 0.3s ease; }
    </style>
</head>
<body class="bg-light">

<div class="container-fluid py-4">
    <h2 class="mb-4 fw-bold text-dark">🛡️ Hi-MLIC Security Monitor</h2>

    <div class="row mb-4">
        <div class="col-md-3">
            <div class="card stat-card shadow-sm p-3 bg-gradient-info">
                <small class="text-uppercase fw-bold opacity-75">Total Requests</small>
                <h2 id="totalCount" class="mb-0">0</h2>
            </div>
        </div>
        <div class="col-md-3">
            <div class="card stat-card shadow-sm p-3 bg-gradient-danger">
                <small class="text-uppercase fw-bold opacity-75">Threats Detected</small>
                <h2 id="threatCount" class="mb-0">0</h2>
            </div>
        </div>
        <div class="col-md-3">
            <div class="card stat-card shadow-sm p-3 bg-gradient-success">
                <small class="text-uppercase fw-bold opacity-75">Benign Traffic</small>
                <h2 id="benignCount" class="mb-0">0</h2>
            </div>
        </div>
        <div class="col-md-3">
            <div class="card stat-card shadow-sm p-3 bg-white border border-danger text-danger text-center">
                <small class="text-uppercase fw-bold">Threat Status</small>
                <h2 id="threatStatus" class="mb-0 h4 py-1">NORMAL</h2>
            </div>
        </div>
    </div>

    <div class="row mb-4">
        <div class="col-12">
            <div class="card shadow-sm p-3">
                <div class="d-flex justify-content-between align-items-center">
                    <small class="text-uppercase text-muted fw-bold">Live Threat Intensity Index</small>
                    <span id="threatPercent" class="badge bg-danger">0%</span>
                </div>
                <div class="progress mt-2" style="height: 12px;">
                    <div id="intensityBar" class="progress-bar progress-bar-striped progress-bar-animated bg-danger" role="progressbar" style="width: 0%"></div>
                </div>
            </div>
        </div>
    </div>

    <div class="row">
        <div class="col-md-8">
            <div class="card shadow-sm mb-4">
                <div class="card-header bg-white border-0 py-3"><strong>Detection Trend (Last 20 Events)</strong></div>
                <div class="card-body">
                    
<div class="chart-container">
    <canvas id="trendChart"></canvas>
</div>

                </div>
            </div>
            
            <div class="card shadow-sm">
                <div class="card-header bg-white border-0 py-3"><strong>Live Network Logs</strong></div>
                <div class="card-body p-0">
                    <div class="table-responsive">
                        <table class="table align-items-center mb-0">
                            <thead class="table-light">
                                <tr>
                                    <th class="ps-4">Timestamp</th>
                                    <th>L1 Result</th>
                                    <th>L2 Classification</th>
                                    <th>Device Mode</th>
                                </tr>
                            </thead>
                            <tbody id="logTableBody"></tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>

        <div class="col-md-4">
            <div class="card shadow-sm p-3 mb-4">
                <div class="card-header bg-white border-0"><strong>Attack Vector Distribution</strong></div>
                <div class="card-body">
                    
<div class="chart-container">
    <canvas id="typeChart"></canvas>
</div>

                </div>
            </div>
        </div>
    </div>
</div>

<script>
    let trendChart, typeChart;
    let lastLogId = 0;

    async function updateDashboard() {
        try {
            const response = await fetch('/api/stats');
            const data = await response.json();

            // 1. Update Counters & Status
            document.getElementById('totalCount').innerText = data.summary.total;
            document.getElementById('threatCount').innerText = data.summary.malicious;
            document.getElementById('benignCount').innerText = data.summary.benign;
            document.getElementById('threatStatus').innerText = data.summary.threat_level || (data.summary.malicious > 0 ? "ALERT" : "NORMAL");
            
            // 2. Update Progress Bar
            const tPercent = data.summary.threat_percent || 0;
            document.getElementById('threatPercent').innerText = tPercent + "%";
            document.getElementById('intensityBar').style.width = tPercent + "%";

            // 3. Update Table
            const tableBody = document.getElementById('logTableBody');
            tableBody.innerHTML = data.recent_logs.map(log => `
                <tr class="${log.layer1_result === 'Malicious' ? 'table-danger' : ''}">
                    <td class="ps-4 small text-muted">${log.timestamp}</td>
                    <td><span class="badge rounded-pill ${log.layer1_result === 'Benign' ? 'bg-success' : 'bg-danger'}">${log.layer1_result}</span></td>
                    <td><code class="fw-bold">${log.layer2_result}</code></td>
                    <td><span class="badge bg-dark">${log.mode}</span></td>
                </tr>
            `).join('');

            // 4. Visual Alert (Pulse) logic
            const latestLog = data.recent_logs[0];
            if (latestLog && latestLog.id > lastLogId) {
                if (latestLog.layer1_result === 'Malicious') {
                    document.body.style.backgroundColor = "#ffe6e6";
                    setTimeout(() => document.body.style.backgroundColor = "#f8f9fa", 400);
                }
                lastLogId = latestLog.id;
            }

            // 5. Update Visualizations
            updateTrendChart(data.history);
            updateTypeChart(data.chart_data);

        } catch (error) {
            console.error("Dashboard update failed:", error);
        }
    }

    function updateTrendChart(history) {
        const ctx = document.getElementById('trendChart').getContext('2d');
        if (trendChart) {
            trendChart.data.labels = history.map((_, i) => i + 1);
            trendChart.data.datasets[0].data = history;
            trendChart.update('none'); // Update without animation for performance
        } else {
            trendChart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: history.map((_, i) => i + 1),
                    datasets: [{
                        label: 'Threat Activity',
                        data: history,
                        borderColor: '#f5365c',
                        backgroundColor: 'rgba(245, 54, 92, 0.1)',
                        fill: true,
                        tension: 0.4
                    }]
                },
                options: { 
                    responsive: true,
                    maintainAspectRatio: false,

                    scales: { 
                    y: { min: 0, 
                    max: 1,
                    ticks: { stepSize: 1 }
                     } 
                   },
                    animation: { duration: 0 }
                }
            });
        }
    }

    function updateTypeChart(typeData) {
        const ctx = document.getElementById('typeChart').getContext('2d');
        const labels = Object.keys(typeData);
        const values = Object.values(typeData);

        if (typeChart) {
            typeChart.data.labels = labels;
            typeChart.data.datasets[0].data = values;
            typeChart.update();
        } else {
            typeChart = new Chart(ctx, {
                type: 'doughnut',
                data: {
                    labels: labels,
                    datasets: [{
                        data: values,
                        backgroundColor: ['#2dce89', '#f5365c', '#11cdef', '#fb6340', '#8965e0']
                    }]
                },
              


options: {
    responsive: true,
    maintainAspectRatio: false,
    plugins: {
        legend: { position: 'bottom' }
    },
    cutout: '70%'
}
            });
        }
    }

    // Initialize & Set Refresh Interval
    updateDashboard();
    setInterval(updateDashboard, 3000);
</script>
</body>
</html>
